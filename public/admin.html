<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NB Hub - Admin Dashboard</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>

  <header>
    <h1>NB HUB ADMIN</h1>
    <div class="nav-links">
      <a href="/index.html">Back to Site</a>
      <button onclick="logout()">Logout</button>
    </div>
  </header>

  <div class="nav-tabs">
    <button class="tab-btn active" onclick="switchTab('uploadTab', this)">Upload Video</button>
    <button class="tab-btn" onclick="switchTab('manageTab', this); loadVideos();">Manage Content</button>
    <button class="tab-btn" onclick="switchTab('usersTab', this); loadUsers();">Manage Users</button>
  </div>

  <!-- UPLOAD TAB -->
  <div id="uploadTab" class="tab-content active">
    <h3>Publish New Video</h3>
    <form id="uploadForm" onsubmit="handleUpload(event)">
      <label>Title</label>
      <input type="text" id="uploadTitle" required>

      <label>Category</label>
      <select id="uploadCategory">
        <option value="General">General</option>
        <option value="Action">Action</option>
        <option value="Comedy">Comedy</option>
        <option value="Tutorial">Tutorial</option>
        <option value="Gaming">Gaming</option>
      </select>

      <label>Video File (MP4)</label>
      <input type="file" id="uploadVideo" accept="video/*" required>

      <label>Thumbnail Cover Image (Optional)</label>
      <input type="file" id="uploadThumb" accept="image/*">

      <button type="submit" class="action-btn">Upload & Publish</button>
    </form>
    <p id="uploadMsg" style="font-weight: bold;"></p>
  </div>

  <!-- CONTENT TAB -->
  <div id="manageTab" class="tab-content">
    <h3>Uploaded Videos</h3>
    <table>
      <thead>
        <tr>
          <th>Title</th>
          <th>Category</th>
          <th>Views</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="videoTableBody"></tbody>
    </table>
  </div>

  <!-- USERS TAB -->
  <div id="usersTab" class="tab-content">
    <h3>User Accounts</h3>
    <table>
      <thead>
        <tr>
          <th>Username</th>
          <th>Role</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="userTableBody"></tbody>
    </table>
  </div>

  <script>
    const token = localStorage.getItem('nb_token');
    const role = localStorage.getItem('nb_role');

    if (!token || role !== 'admin') {
      alert('Access Denied: Admins Only');
      window.location.href = '/login.html';
    }

    function logout() {
      localStorage.clear();
      window.location.href = '/login.html';
    }

    function switchTab(tabId, btn) {
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      btn.classList.add('active');
    }

    async function handleUpload(e) {
      e.preventDefault();
      const msg = document.getElementById('uploadMsg');
      msg.innerText = 'Uploading video file... Please wait.';
      msg.style.color = '#f0ad4e';

      const formData = new FormData();
      formData.append('title', document.getElementById('uploadTitle').value);
      formData.append('category', document.getElementById('uploadCategory').value);
      formData.append('video', document.getElementById('uploadVideo').files[0]);
      if (document.getElementById('uploadThumb').files[0]) {
        formData.append('thumbnail', document.getElementById('uploadThumb').files[0]);
      }

      const res = await fetch('/api/upload', {
        method: 'POST',
        headers: { 'Authorization': `Bearer ${token}` },
        body: formData
      });

      const data = await res.json();
      if (res.ok) {
        msg.innerText = data.message;
        msg.style.color = '#5cb85c';
        document.getElementById('uploadForm').reset();
      } else {
        msg.innerText = data.message;
        msg.style.color = '#d9534f';
      }
    }

    async function loadVideos() {
      const res = await fetch('/api/videos', { headers: { 'Authorization': `Bearer ${token}` } });
      const videos = await res.json();
      const tbody = document.getElementById('videoTableBody');
      tbody.innerHTML = videos.map(v => `
        <tr>
          <td>${v.title}</td>
          <td>${v.category}</td>
          <td>${v.views}</td>
          <td>
            <button class="btn-sm btn-danger" onclick="deleteVideo(${v.id})">Delete</button>
          </td>
        </tr>
      `).join('');
    }

    async function deleteVideo(id) {
      if (!confirm('Are you sure you want to delete this video?')) return;
      await fetch(`/api/videos/${id}`, {
        method: 'DELETE',
        headers: { 'Authorization': `Bearer ${token}` }
      });
      loadVideos();
    }

    async function loadUsers() {
      const res = await fetch('/api/users', { headers: { 'Authorization': `Bearer ${token}` } });
      const users = await res.json();
      const tbody = document.getElementById('userTableBody');
      tbody.innerHTML = users.map(u => `
        <tr>
          <td>${u.username}</td>
          <td>${u.role}</td>
          <td><span style="color: ${u.is_banned ? '#d9534f' : '#5cb85c'};">${u.is_banned ? 'Banned' : 'Active'}</span></td>
          <td>
            <button class="btn-sm ${u.is_banned ? 'btn-success' : 'btn-danger'}" onclick="toggleBan(${u.id}, ${u.is_banned})">
              ${u.is_banned ? 'Unban' : 'Ban'}
            </button>
          </td>
        </tr>
      `).join('');
    }

    async function toggleBan(id, isBanned) {
      await fetch(`/api/users/${id}/ban`, {
        method: 'PUT',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${token}`
        },
        body: JSON.stringify({ is_banned: !isBanned })
      });
      loadUsers();
    }
  </script>
</body>
</html>
